name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]     # despliegue a producción
  pull_request:               # previews para PRs (incluye PRs desde dev a main)
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Si necesitás build (Vite, etc.), agregalo acá (npm ci / npm run build)
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with: { node-version: '20' }
      # - run: npm ci
      # - run: npm run build
      # y cambia el path del artifact a "dist" (ver más abajo)

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Remove CNAME for previews
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          rm -f CNAME
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # si usás build, cambialo por 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
